```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exposición de Matemáticas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <nav>
            <a href="#saludo">SALUDO</a>
            <a href="#trabajo1">TRABAJO_1</a>
            <a href="#trabajo2">TRABAJO_2</a>
            <a href="#trabajo3">TRABAJO_3</a>
            <a href="#trabajo4">TRABAJO_4</a>
        </nav>
    </header>

    <section id="saludo">
        <h1>WELCOME</h1>
        <p>
            Trabajo de Matemáticas<br>
            Presentado por: Juan Pablo Duran
        </p>
    </section>

    <!-- Ejercicio de fracciones -->
    <section id="trabajo1">
        <h2>Operaciones con Fracciones</h2>

        <div class="ejercicio">
            <div class="operacion">

                <div class="fraccion">
                    <input type="number" id="num1" placeholder="Num 1">
                    <div class="linea"></div>
                    <input type="number" id="den1" placeholder="Den 1">
                </div>

                <span id="operador" class="signo">?</span>

                <div class="fraccion">
                    <input type="number" id="num2" placeholder="Num 2">
                    <div class="linea"></div>
                    <input type="number" id="den2" placeholder="Den 2">
                </div>

                <div class="botones">
                    <button id="sumar">Sumar</button>
                    <button id="restar">Restar</button>
                    <button id="multiplicar">Multiplicar</button>
                    <button id="dividir">Dividir</button>
                </div>

                <div id="resultado" class="operacion"></div>

            </div>
        </div>
    </section>

    <!-- Ejercicio de ecuaciones -->
    <section id="trabajo2">
        <h2>Resolver Ecuación</h2>

        <div class="ejercicio">
            <p id="pregunta"></p>
            <div id="opciones"></div>
        </div>
    </section>

    <!-- Ejercicio 3: Video -->
    <section id="trabajo3">
        <h2>Video de Matemáticas</h2>

        <div class="ejercicio">
            <p>Aquí puedes insertar un video explicativo:</p>

            <video width="560" height="315" controls>
                <source src="video.mp4" type="video/mp4">
                Tu navegador no puede reproducir este video.
            </video>

        </div>
    </section>

    <!-- Ejercicio 4: Áreas y Perímetros -->
    <section id="trabajo4">
        <h2>Áreas y Perímetros</h2>

        <div class="ejercicio">

            <label for="figura">Selecciona una figura:</label>

            <select id="figura">
                <option value="cuadrado">Cuadrado</option>
                <option value="rectangulo">Rectángulo</option>
                <option value="triangulo">Triángulo</option>
                <option value="circulo">Círculo</option>
                <option value="trapecio">Trapecio</option>
            </select>

            <div style="display: flex; gap: 20px; margin-top: 15px;">

                <div id="inputs"></div>
                <div id="figuraDibujo"></div>

            </div>  

            <button id="calcular">Calcular</button>

            <div id="resultadoAreas"></div>

        </div>
    </section>

    <script src="script.js" defer></script>

</body>

</html>
```
